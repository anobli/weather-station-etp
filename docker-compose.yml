services:
  weather-station-etp:
    image: ghcr.io/anobli/weather-station-etp:main
    # `docker compose up -d` always checks GHCR for a newer :main
    pull_policy: always
    labels:
      # opt in to auto-update by the watchtower service below
      com.centurylinklabs.watchtower.enable: "true"
    # host networking is required to receive station traffic
    # (Tempest UDP broadcast on 50222, Ecowitt HTTP upload on ECOWITT_PORT)
    network_mode: host
    restart: unless-stopped
    environment:
      # --- Location settings (required for accurate ETP) ---
      LATITUDE: ${LATITUDE:-48.8566}       # decimal degrees, positive = North
      ELEVATION: ${ELEVATION:-100}          # metres above sea level
      # Height of the station anemometer above ground (metres)
      ANEMOMETER_HEIGHT: ${ANEMOMETER_HEIGHT:-2.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      # IANA timezone for CSV export day boundaries, e.g. Europe/Paris
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      # Raw observation retention (hours) before purge; default 90 days so
      # future ET0 methods can be recomputed over real history
      OBSERVATION_RETENTION_HOURS: ${OBSERVATION_RETENTION_HOURS:-2160}
      # Weather station driver(s) (see stations/__init__.py): tempest | ecowitt | pwsweather
      # Comma-separate to run several at once (one DB + ETP each), e.g. tempest,ecowitt
      STATION_TYPE: ${STATION_TYPE:-tempest}
      # Ecowitt only: port the gateway's "Customized" upload (Ecowitt protocol)
      # posts to, and optional PASSKEY filter (logged on first upload)
      ECOWITT_PORT: ${ECOWITT_PORT:-8090}
      ECOWITT_PASSKEY: ${ECOWITT_PASSKEY:-}
      # PWSWeather only: station + Xweather/AerisWeather API credentials
      # (https://www.xweather.com/), polled every PWSWEATHER_POLL_SECONDS.
      # Trial signups issue a single "API key" shaped CLIENTID_SECRET -> put
      # it whole in PWSWEATHER_API_KEY. If you have a separate client_id and
      # client_secret instead, set PWSWEATHER_CLIENT_ID/_CLIENT_SECRET.
      PWSWEATHER_STATION_ID: ${PWSWEATHER_STATION_ID:-}
      PWSWEATHER_API_KEY: ${PWSWEATHER_API_KEY:-}
      PWSWEATHER_POLL_SECONDS: ${PWSWEATHER_POLL_SECONDS:-300}
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # Polls GHCR and redeploys weather-station-etp when a new :main image is
  # published by CI. Scoped by label, so other containers on the host are
  # left alone. nickfedor/watchtower is the maintained fork of the archived
  # containrrr/watchtower (which also breaks on Docker Engine >= 29).
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"          # remove the superseded image
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}  # seconds
