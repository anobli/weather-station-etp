services:
  weather-station-etp:
    image: ghcr.io/anobli/weather-station-etp:main
    # host networking is required to receive station traffic
    # (Tempest UDP broadcast on 50222, Ecowitt HTTP upload on ECOWITT_PORT)
    network_mode: host
    restart: unless-stopped
    environment:
      # --- Location settings (required for accurate ETP) ---
      LATITUDE: ${LATITUDE:-48.8566}       # decimal degrees, positive = North
      ELEVATION: ${ELEVATION:-100}          # metres above sea level
      # Height of the station anemometer above ground (metres)
      ANEMOMETER_HEIGHT: ${ANEMOMETER_HEIGHT:-2.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      # IANA timezone for CSV export day boundaries, e.g. Europe/Paris
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      # Weather station driver(s) (see stations/__init__.py): tempest | ecowitt
      # Comma-separate to run several at once (one DB + ETP each), e.g. tempest,ecowitt
      STATION_TYPE: ${STATION_TYPE:-tempest}
      # Ecowitt only: port the gateway's "Customized" upload (Ecowitt protocol)
      # posts to, and optional PASSKEY filter (logged on first upload)
      ECOWITT_PORT: ${ECOWITT_PORT:-8090}
      ECOWITT_PASSKEY: ${ECOWITT_PASSKEY:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
