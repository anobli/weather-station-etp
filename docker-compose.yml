services:
  weather-station-etp:
    image: ghcr.io/anobli/weather-station-etp:main
    # host networking is required to receive station broadcasts (e.g. Tempest UDP port 50222)
    network_mode: host
    restart: unless-stopped
    environment:
      # --- Location settings (required for accurate ETP) ---
      LATITUDE: ${LATITUDE:-48.8566}       # decimal degrees, positive = North
      ELEVATION: ${ELEVATION:-100}          # metres above sea level
      # Height of the station anemometer above ground (metres)
      ANEMOMETER_HEIGHT: ${ANEMOMETER_HEIGHT:-2.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      # IANA timezone for CSV export day boundaries, e.g. Europe/Paris
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      # Weather station driver (see stations/__init__.py): tempest
      STATION_TYPE: ${STATION_TYPE:-tempest}
      DATA_DIR: /data
    volumes:
      - ./data:/data
